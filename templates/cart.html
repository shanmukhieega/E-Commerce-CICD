<!DOCTYPE html>
<html>

<head>

    <title>Shopping Cart</title>

    <link rel="stylesheet"
          href="/static/style.css">

</head>

<body>

    <h1>Shopping Cart</h1>

    {% if products %}

        {% for product in products %}

        <div class="cart-item">

            <h2>{{ product.name }}</h2>

            <p>
                Price: ₹{{ product.price }}
            </p>

        </div>

        {% endfor %}

        <a href="/checkout">
            <button>Place Order</button>
        </a>

    {% else %}

        <p>Your cart is empty.</p>

    {% endif %}

    <br><br>

    <a href="/">Continue Shopping</a>

</body>

</html>
